name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: node scripts/docs-reference.mjs --check
      - run: pnpm exec vitest run --project unit
      - run: pnpm pack:smoke
      - run: pnpm build:examples
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smolter/integration-tests exec playwright install --with-deps --only-shell chromium
      - run: pnpm coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @smolter/integration-tests exec playwright install --with-deps --only-shell chromium
      - run: pnpm smoke
      - run: SMOLTER_ROUTES=manual SMOLTER_TEST_PORT=4473 pnpm smoke router.spec.ts
      - run: pnpm build:examples
      - run: pnpm smoke:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/

  jsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - name: Validate JSR package (dry run, no publication)
        run: pnpm jsr:check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - name: Build docs for validation (no deployment)
        run: pnpm build:site
      - run: pnpm --filter @smolter/integration-tests exec playwright install --with-deps --only-shell chromium
      - name: Validate docs hydration, navigation and size budget
        run: pnpm smoke:site
