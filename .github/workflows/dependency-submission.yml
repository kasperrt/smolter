name: Submit pnpm dependencies

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/dependency-snapshot.mjs
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate resolved dependency snapshot
        run: node scripts/dependency-snapshot.mjs > "$RUNNER_TEMP/dependency-snapshot.json"
      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/dependency-snapshot.json"
