<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>smolter _</title>
    <script>
      const match = location.pathname.match(/^\/smolter(?:\/(?:react|preact))?(\/.*)$/);

      if (match) {
        const route = match[1] + location.search + location.hash;
        const target = `/smolter/?__route=${encodeURIComponent(route)}`;

        location.replace(target);
      }
    </script>
  </head>
  <body>
    <a href="/smolter/">Open smolter</a>
  </body>
</html>
